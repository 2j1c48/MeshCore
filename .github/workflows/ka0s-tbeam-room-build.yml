name: KA0S T-Beam 1W Room Build

on:
  push:
    branches:
      - ka0s-room-sd-persistence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tbeam-room:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build T-Beam 1W Room Server
        run: pio run -e LilyGo_TBeam_1W_room_server

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ka0s-tbeam-1w-room
          path: |
            .pio/build/LilyGo_TBeam_1W_room_server/firmware.bin
            .pio/build/LilyGo_TBeam_1W_room_server/firmware.elf
